name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages on this repo is served from the gh-pages branch (source: "Deploy from
# a branch"), because enabling the Actions source needs repo-admin rights that
# the workflow token does not have. The github-pages environment is therefore
# locked to gh-pages, and a deploy-pages job running on main is rejected with
# "Branch main is not allowed to deploy to github-pages". So publishing is a
# plain push of main's tree onto gh-pages; GitHub serves it from there.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish main to gh-pages
        run: git push origin HEAD:refs/heads/gh-pages
